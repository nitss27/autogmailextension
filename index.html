<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulk Email Harvester</title>
  <style>
    body{font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:20px}
    .card{background:#111827;border:1px solid #334155;border-radius:8px;padding:16px;margin-bottom:12px}
    textarea,input{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #334155;border-radius:6px;background:#020617;color:#e2e8f0}
    button{padding:9px 12px;border:none;border-radius:6px;background:#2563eb;color:#fff;margin-right:8px;cursor:pointer}
    .row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #334155;padding:8px;text-align:left}
  </style>
</head>
<body>
  <h1>Bulk Email Harvester</h1>
  <div class="card">
    <label>Websites (one per line)</label>
    <textarea id="urls" rows="8" placeholder="example.com\nsite.org"></textarea>

    <label>Upload .txt list</label>
    <input type="file" id="file" accept=".txt" />

    <div class="row">
      <div>
        <label>Hard timeout (sec)</label>
        <input id="timeout" type="number" value="45" min="10" />
      </div>
      <div>
        <label>Max contact pages</label>
        <input id="maxPages" type="number" value="5" min="1" />
      </div>
    </div>

    <label>Exclusion rules (optional)</label>
    <textarea id="rules" rows="5" placeholder="noreply@site.com\n@example.com\nno-reply"></textarea>

    <button onclick="startRun()">Start</button>
    <button onclick="callApi('/api/skip')">Skip Current</button>
    <button onclick="callApi('/api/stop')">Stop</button>
    <button onclick="callApi('/api/continue')">Continue</button>
    <button onclick="callApi('/api/reset')">Reset</button>
  </div>

  <div class="card">
    <h3>Status</h3>
    <pre id="status">Idle</pre>
    <table>
      <thead><tr><th>Domain</th><th>Emails</th><th>Status</th><th>Error</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

<script>
let uploadedLines = [];
let timer = null;

document.getElementById('file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) { uploadedLines = []; return; }
  const text = await f.text();
  uploadedLines = text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
});

async function callApi(path, body={}) {
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  return r.json();
}

async function startRun(){
  const typed = document.getElementById('urls').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const urls = [...typed, ...uploadedLines];
  const payload = {
    urls,
    exclusion_rules: document.getElementById('rules').value,
    hard_timeout: Number(document.getElementById('timeout').value || 45),
    max_pages: Number(document.getElementById('maxPages').value || 5),
  };
  const res = await callApi('/api/start', payload);
  if (!res.ok) { alert(res.error || 'Start failed'); return; }
  if (timer) clearInterval(timer);
  timer = setInterval(refreshStatus, 1000);
}

async function refreshStatus(){
  const r = await fetch('/api/status');
  const data = await r.json();
  document.getElementById('status').textContent = JSON.stringify({
    status: data.status,
    current_domain: data.current_domain,
    progress: `${Math.min(data.current_index+1, data.total||0)}/${data.total||0}`,
    playwright: data.playwright
  }, null, 2);

  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  (data.results || []).forEach(row => {
    const tr = document.createElement('tr');
    const emails = (row.emails || []).map(e => e.email || e).join(', ');
    tr.innerHTML = `<td>${row.url || ''}</td><td>${emails || '(none)'}</td><td>${row.status || ''}</td><td>${row.error || ''}</td>`;
    tbody.appendChild(tr);
  });

  if (data.status === 'done' || data.status === 'paused' || data.status === 'idle') {
    clearInterval(timer);
    timer = null;
  }
}
</script>
</body>
</html>
