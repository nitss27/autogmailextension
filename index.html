<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Scraper Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background:#0f172a; color:#e2e8f0; }
    .card { background:#111827; border:1px solid #334155; border-radius:8px; padding:16px; margin-bottom:16px; }
    textarea, input { width:100%; margin:6px 0 12px; padding:10px; border-radius:6px; border:1px solid #334155; background:#0b1220; color:#e2e8f0; }
    .row { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
    button { background:#2563eb; color:white; border:none; border-radius:6px; padding:10px 14px; cursor:pointer; }
    table { width:100%; border-collapse: collapse; margin-top:12px; }
    th, td { border-bottom:1px solid #334155; padding:8px; text-align:left; }
    .muted { color:#94a3b8; font-size:12px; }
  </style>
</head>
<body>
  <h1>Email Scraper Web UI</h1>
  <p class="muted">Upload a file or paste websites. Each site can be opened in a headed browser during processing.</p>

  <div class="card">
    <label>Websites (one per line)</label>
    <textarea id="websites" rows="8" placeholder="example.com\nhttps://foo.org"></textarea>

    <label>Upload website list (.txt)</label>
    <input type="file" id="fileInput" accept=".txt" />

    <div class="row">
      <div>
        <label>Timeout (seconds)</label>
        <input id="timeout" type="number" value="45" min="5" />
      </div>
      <div>
        <label>Max pages</label>
        <input id="maxPages" type="number" value="5" min="0" />
      </div>
      <div>
        <label>Workers</label>
        <input id="workers" type="number" value="4" min="1" />
      </div>
    </div>

    <label>Exclude emails (comma-separated)</label>
    <input id="excludeEmails" type="text" placeholder="noreply@site.com,sales@site.com" />

    <label>Exclude domains (comma-separated)</label>
    <input id="excludeDomains" type="text" placeholder="example.com,internal.local" />

    <div style="display:flex; gap:12px; margin:10px 0;">
      <label><input id="continueMode" type="checkbox" /> Continue pending</label>
      <label><input id="openHeaded" type="checkbox" checked /> Open each page in headed browser</label>
    </div>

    <button id="runBtn">Run Scrape</button>
  </div>

  <div class="card">
    <h3>Summary</h3>
    <pre id="summary" class="muted">Idle</pre>
    <table>
      <thead><tr><th>Domain</th><th>Emails</th><th>Status</th></tr></thead>
      <tbody id="results"></tbody>
    </table>
  </div>

<script>
let uploaded = "";
document.getElementById('fileInput').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  uploaded = f ? await f.text() : "";
});

document.getElementById('runBtn').addEventListener('click', async () => {
  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  document.getElementById('summary').textContent = 'Running...';
  document.getElementById('results').innerHTML = '';
  try {
    const payload = {
      websites: document.getElementById('websites').value,
      uploaded,
      timeout: Number(document.getElementById('timeout').value || 45),
      max_pages: Number(document.getElementById('maxPages').value || 5),
      workers: Number(document.getElementById('workers').value || 4),
      exclude_emails: document.getElementById('excludeEmails').value,
      exclude_domains: document.getElementById('excludeDomains').value,
      continue: document.getElementById('continueMode').checked,
      open_headed: document.getElementById('openHeaded').checked,
    };
    const res = await fetch('/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    document.getElementById('summary').textContent = JSON.stringify(data.summary, null, 2);
    const tbody = document.getElementById('results');
    data.results.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${r.domain}</td><td>${(r.emails || []).join(', ') || '(none)'}</td><td>${r.failed ? 'FAILED: '+(r.reason||'error') : 'OK'}</td>`;
      tbody.appendChild(tr);
    });
  } catch (err) {
    document.getElementById('summary').textContent = 'Error: ' + err;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
