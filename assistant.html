<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Resume Assistant Tab</title>
    <link rel="stylesheet" href="assistant.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <h1>⚡ Resume Assistant</h1>
        <div class="top-actions">
          <button id="selectTargetBtn" title="Refresh target job tab">Refresh target</button>
          <span id="targetInfo"></span>
        </div>
      </header>

      <section class="editor">
        <input id="itemLabel" type="text" placeholder="Label (e.g., Current Company)" />
        <input id="itemValue" type="text" placeholder="Value" />
        <select id="itemCategory">
          <option>Personal</option><option>Contact</option><option>Address</option><option>Skills</option>
          <option>Experience</option><option>Education</option><option>Interests</option>
        </select>
        <input id="itemTags" type="text" placeholder="Tags (comma separated)" />
        <button id="addUpdateBtn" type="button">Add Item</button>
        <button id="clearEditBtn" type="button">Clear</button>
      </section>

      <section class="csv-import">
        <input id="csvFile" type="file" accept=".csv,text/csv" />
        <button id="importCsvBtn" type="button">Import CSV</button>
        <span class="hint">CSV headers: <code>label,value,category,tags</code></span>
      </section>

      <div class="toolbar">
        <button id="prevCat" title="Left arrow">◀</button>
        <div id="catBar" class="cats"></div>
        <button id="nextCat" title="Right arrow">▶</button>
      </div>

      <input id="search" type="text" placeholder="Search (Alt+Q). Alt+N: add form • Left/Right: category • Up/Down: item • Enter: copy • Shift+Enter: fill" autocomplete="off" />
      <div id="meta" class="meta"></div>
      <section id="list" class="list" aria-live="polite"></section>
    </main>
    <script src="assistant.js"></script>
  </body>
</html>
