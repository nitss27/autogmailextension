<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>LinkedIn Company Extractor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>LinkedIn Company Extractor</h1>
      <p class="hint">1) Fetch company URLs from job cards, 2) process company profiles, 3) copy output.</p>

      <div class="actions">
        <button id="fetchBtn">Fetch Company URLs</button>
        <button id="processBtn">Process Company Profiles</button>
      </div>

      <label for="output">Results (JSON)</label>
      <textarea id="output" rows="14" placeholder="Results will appear here..."></textarea>

      <div class="actions">
        <button id="copyBtn" type="button">Copy All</button>
        <button id="clearBtn" type="button">Clear</button>
      </div>

      <pre id="status"></pre>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
