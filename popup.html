<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Form Capture + ChatGPT Autofill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Form Capture + ChatGPT Autofill</h1>
      <p class="hint">1) Open form tab. 2) Capture + send to ChatGPT. 3) Paste ChatGPT TSV output and fill form.</p>

      <label for="chatUrl">ChatGPT tab URL</label>
      <input id="chatUrl" type="url" />

      <label for="maxChars">Max HTML chars to send</label>
      <input id="maxChars" type="number" min="20000" step="10000" value="120000" />

      <div class="actions">
        <button id="captureSendBtn">Capture + Send to ChatGPT</button>
      </div>

      <label for="mappingText">Paste ChatGPT TSV output (xpath[TAB]value)</label>
      <textarea id="mappingText" rows="8" placeholder="xpath\tvalue"></textarea>

      <div class="actions">
        <button id="fillBtn">Fill Current Form Tab</button>
      </div>

      <pre id="status"></pre>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
