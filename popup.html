<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bulk Email Extractor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Bulk Email Extractor</h1>
      <p>Sequential active-tab scraping with pause/resume, skip-current, and strict per-site timeout.</p>

      <label class="fieldLabel" for="websiteInput">Website list</label>
      <textarea id="websiteInput" placeholder="example.com&#10;https://openai.com"></textarea>

      <label class="fieldLabel" for="excludeInput">Exclude emails/domains (one per line, saved; use @domain.com)</label>
      <textarea id="excludeInput" class="excludeBox" placeholder="info@example.com&#10;@wixpress.com"></textarea>

      <label class="fieldLabel" for="strictTimeoutSec">Strict timeout per website (seconds)</label>
      <input id="strictTimeoutSec" type="number" min="1" max="120" value="10" />

      <div class="actions">
        <button id="startBtn">Start / Resume</button>
        <button id="stopBtn" disabled>Stop</button>
        <button id="skipBtn" disabled>Skip Current</button>
        <button id="copyBtn" disabled>Copy Table</button>
      </div>

      <div id="status" class="status"></div>
      <div id="results"></div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
