<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Gmail Auto Sender</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Gmail Auto Sender</h1>
      <p class="hint">No OAuth Client ID needed. Google Sheet mode uses public CSV export.</p>

      <label for="mode">Input mode</label>
      <select id="mode">
        <option value="single">Single email</option>
        <option value="paste">Paste rows (CSV/TSV)</option>
        <option value="sheet">Google Sheet URL</option>
      </select>

      <section id="singleFields" class="mode-block">
        <label for="to">To</label>
        <input id="to" type="text" placeholder="person@example.com" />
        <label for="subject">Subject</label>
        <input id="subject" type="text" placeholder="Application for role" />
        <label for="body">Body (supports **bold**, __underline__, and - bullets)</label>
        <textarea id="body" rows="5" placeholder="Hello...\n- item"></textarea>
      </section>

      <section id="pasteFields" class="mode-block hidden">
        <label for="rows">Paste rows with headers: to,subject,body[,sent]</label>
        <textarea id="rows" rows="8" placeholder="to,subject,body,sent"></textarea>
      </section>

      <section id="sheetFields" class="mode-block hidden">
        <label for="sheetUrl">Google Sheet URL (saved)</label>
        <input id="sheetUrl" type="url" placeholder="https://docs.google.com/spreadsheets/d/..." />
      </section>

      <label for="sendLimit">Send limit per run (saved, blank = all)</label>
      <input id="sendLimit" type="number" min="1" step="1" placeholder="e.g. 20" />

      <label for="resumeFile">Attachment (resume)</label>
      <input id="resumeFile" type="file" accept=".pdf,.doc,.docx,.txt" />

      <div class="actions">
        <button id="runBtn">Send One-by-One</button>
        <button id="clearBtn" type="button">Clear saved settings</button>
      </div>
      <pre id="status"></pre>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
