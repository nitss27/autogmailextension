<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>LinkedIn Company Extractor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>LinkedIn Company Extractor</h1>
      <p class="hint">Fetch all companies from visible job list, then open each company in a new tab and extract details.</p>

      <div class="actions">
        <button id="fetchBtn">Fetch All Companies</button>
        <button id="processBtn">Process Company Profiles</button>
      </div>

      <label for="urlsBox">Company profile URLs</label>
      <textarea id="urlsBox" rows="6" placeholder="https://www.linkedin.com/company/...\n..."></textarea>

      <div class="actions">
        <button id="copyBtn" type="button">Copy Table (TSV)</button>
        <button id="clearBtn" type="button">Clear</button>
      </div>

      <div class="table-wrap">
        <table id="resultsTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Company</th>
              <th>LinkedIn URL</th>
              <th>Website</th>
              <th>Industry</th>
              <th>Company Size</th>
              <th>Headquarters</th>
              <th>Specialties</th>
              <th>Verified Page</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>

      <pre id="status"></pre>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
