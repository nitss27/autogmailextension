<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Domain Email Harvester</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Domain Email Harvester</h1>
      <p>Opens websites in batches, scans rendered page, then checks home/contact view-source and exports both email sets.</p>

      <label class="fieldLabel" for="websiteInput">Websites</label>
      <textarea id="websiteInput" placeholder="example.com&#10;https://openai.com"></textarea>

      <label class="fieldLabel" for="maxTabsAtTime">Max websites opened at a time</label>
      <input id="maxTabsAtTime" type="number" min="1" max="20" value="5" />

      <div class="actions">
        <button id="processBtn">Process Websites</button>
        <button id="copyBtn" disabled>Copy Table</button>
      </div>

      <div id="status" class="status"></div>
      <div id="results"></div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
