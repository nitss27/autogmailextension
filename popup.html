<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bulk Email Extractor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Bulk Email Extractor</h1>
      <p>Paste one URL/domain per line and click Start. If a run is paused, Start resumes from saved progress.</p>

      <label class="fieldLabel" for="websiteInput">Website list</label>
      <textarea id="websiteInput" placeholder="example.com&#10;https://openai.com"></textarea>

      <label class="fieldLabel" for="excludeInput">Exclude emails/domains (one per line, saved; use @domain.com)</label>
      <textarea id="excludeInput" class="excludeBox" placeholder="person@example.com&#10;@example.com"></textarea>

      <label class="fieldLabel" for="tabLoadTimeoutMs">Tab load timeout (ms, optional; saved)</label>
      <input id="tabLoadTimeoutMs" type="number" min="1000" max="120000" value="20000" />

      <label class="fieldLabel" for="strictSkipTimeoutSec">Strict skip timeout per website (seconds)</label>
      <input id="strictSkipTimeoutSec" type="number" min="1" max="300" value="10" />

      <div class="actions">
        <button id="startBtn">Start</button>
        <button id="stopBtn" disabled>Stop</button>
        <button id="skipBtn" disabled>Skip Current</button>
        <button id="clearBtn">Clear List</button>
        <button id="copyBtn" disabled>Copy Table</button>
      </div>

      <div id="status" class="status"></div>
      <div id="results"></div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
