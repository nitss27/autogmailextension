<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AI Form Auto Filler</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>AI Form Auto Filler</h1>
      <p class="hint">Provide form links, then the extension will capture required fields, ask ChatGPT for values, and fill each form automatically.</p>

      <label for="chatUrl">ChatGPT conversation URL</label>
      <input id="chatUrl" type="url" />

      <label for="formUrls">Form links (one URL per line)</label>
      <textarea id="formUrls" rows="6" placeholder="https://example.com/form-1\nhttps://example.com/form-2"></textarea>

      <label for="maxChars">Max page source chars</label>
      <input id="maxChars" type="number" min="20000" step="10000" value="120000" />

      <label class="check">
        <input id="autoSubmit" type="checkbox" />
        Auto submit after filling (only if submit button is found)
      </label>

      <div class="actions">
        <button id="runBtn">Run Full Automation</button>
      </div>

      <pre id="status"></pre>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
